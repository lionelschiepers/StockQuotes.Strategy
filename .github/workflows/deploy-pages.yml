name: Deploy OptionsWheel to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-pages.yml"
      - "OptionsWheel/web/**"
      - "OptionsWheel/config/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  DATA_BRANCH: ow-data

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build publish folder
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site/data/output

          cp -R OptionsWheel/web _site/web
          cp -R OptionsWheel/config _site/config

          # Scan results are not committed to main; publish the latest ones
          # saved by the analysis workflow on the data branch.
          if git ls-remote --exit-code --heads origin "$DATA_BRANCH" > /dev/null; then
            git fetch --depth=1 origin "$DATA_BRANCH"
            git archive FETCH_HEAD output | tar -x -C _site/data
          else
            echo "::warning::No $DATA_BRANCH branch yet; run the analysis workflow first."
          fi

          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=./web/index.html">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>OptionsWheel Dashboard</title>
          </head>
          <body>
            <p>Redirecting to <a href="./web/index.html">OptionsWheel dashboard</a>...</p>
          </body>
          </html>
          HTML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
