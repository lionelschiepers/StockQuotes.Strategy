name: Run OptionsWheel analysis

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/run-analysis.yml"
      - "OptionsWheel/analyze.cmd"
      - "OptionsWheel/analyze_calls.py"
      - "OptionsWheel/analyze_puts.py"
      - "OptionsWheel/requirements.txt"
      - "OptionsWheel/src/**"
      - "OptionsWheel/config/**"
      - "OptionsWheel/data/**"

permissions:
  contents: write

jobs:
  analysis:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: OptionsWheel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Analyze CALL options
        run: python analyze_calls.py

      - name: Analyze PUT options
        run: python analyze_puts.py

      - name: Commit updated data files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "chore: update analysis data [skip ci]"
          git push
