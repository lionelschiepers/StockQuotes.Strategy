name: Run OptionsWheel analysis

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * *"
    - cron: "0 15 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/run-analysis.yml"
      - "OptionsWheel/analyze.cmd"
      - "OptionsWheel/analyze_calls.py"
      - "OptionsWheel/analyze_puts.py"
      - "OptionsWheel/requirements.txt"
      - "OptionsWheel/src/**"
      - "OptionsWheel/config/**"
      - "OptionsWheel/data/**"

permissions:
  contents: write

jobs:
  analysis:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: OptionsWheel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Brussels schedule window
        id: brussels_time
        run: |
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          brussels_hour=$(TZ=Europe/Brussels date +%H)
          if [[ "$brussels_hour" == "16" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping scheduled run: current Brussels hour is $brussels_hour, not 16."
          fi

      - name: Set up Python
        if: steps.brussels_time.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.brussels_time.outputs.should_run == 'true'
        run: python -m pip install -r requirements.txt

      - name: Analyze CALL options
        if: steps.brussels_time.outputs.should_run == 'true'
        run: python analyze_calls.py

      - name: Analyze PUT options
        if: steps.brussels_time.outputs.should_run == 'true'
        run: python analyze_puts.py

      - name: Commit updated data files
        if: steps.brussels_time.outputs.should_run == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "chore: update analysis data []"
          git push
