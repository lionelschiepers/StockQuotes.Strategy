name: Run OptionsWheel analysis

on:
  workflow_dispatch:
  schedule:
    # 17:30 UTC = mid-session in New York in both EST and EDT, weekdays only.
    - cron: "30 17 * * 1-5"

permissions:
  contents: write # push scan history to the data branch
  pages: write
  id-token: write

concurrency:
  # Never cancel a run half-way through pushing the data branch.
  group: optionswheel-analysis
  cancel-in-progress: false

env:
  DATA_BRANCH: ow-data
  PYTHONPATH: src

jobs:
  analysis:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: OptionsWheel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: OptionsWheel/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Check out data branch
        working-directory: .
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898699+github-actions[bot]@users.noreply.github.com"
          data_dir="$RUNNER_TEMP/ow-data"
          if git ls-remote --exit-code --heads origin "$DATA_BRANCH" > /dev/null; then
            git fetch --depth=1 origin "$DATA_BRANCH:$DATA_BRANCH"
            git worktree add "$data_dir" "$DATA_BRANCH"
          else
            echo "Creating orphan branch $DATA_BRANCH"
            git worktree add --detach "$data_dir"
            git -C "$data_dir" checkout --orphan "$DATA_BRANCH"
            git -C "$data_dir" rm -rf --quiet .
          fi

      - name: Restore history
        run: python -m options_wheel.datasync pull "$RUNNER_TEMP/ow-data"

      - name: Analyze CALL options
        run: python analyze_calls.py

      - name: Analyze PUT options
        run: python analyze_puts.py

      - name: Grade expired scans
        # Grading is a feedback report; an API hiccup must not lose today's scan.
        continue-on-error: true
        run: |
          python -m options_wheel.outcomes --type call
          python -m options_wheel.outcomes --type put

      - name: Save history to data branch
        run: |
          data_dir="$RUNNER_TEMP/ow-data"
          python -m options_wheel.datasync push "$data_dir"
          cd "$data_dir"
          git add -A
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit --quiet -m "data: scan $(date -u +%F)"
          git push origin "HEAD:$DATA_BRANCH"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build publish folder
        working-directory: .
        run: |
          rm -rf _site
          mkdir -p _site/data

          cp -R OptionsWheel/web _site/web
          cp -R OptionsWheel/data/output _site/data/output
          cp -R OptionsWheel/config _site/config

          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=./web/index.html">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>OptionsWheel Dashboard</title>
          </head>
          <body>
            <p>Redirecting to <a href="./web/index.html">OptionsWheel dashboard</a>...</p>
          </body>
          </html>
          HTML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
