name: Run OptionsWheel analysis

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * *"
    - cron: "0 15 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/run-analysis.yml"
      - "OptionsWheel/analyze.cmd"
      - "OptionsWheel/analyze_calls.py"
      - "OptionsWheel/analyze_puts.py"
      - "OptionsWheel/requirements.txt"
      - "OptionsWheel/src/**"
      - "OptionsWheel/config/**"
      - "OptionsWheel/data/**"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  analysis:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: OptionsWheel

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Brussels schedule window
        id: brussels_time
        run: |
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          brussels_hour=$(TZ=Europe/Brussels date +%H)
          if [[ "$brussels_hour" == "16" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping scheduled run: current Brussels hour is $brussels_hour, not 16."
          fi

      - name: Set up Python
        if: steps.brussels_time.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.brussels_time.outputs.should_run == 'true'
        run: python -m pip install -r requirements.txt

      - name: Analyze CALL options
        if: steps.brussels_time.outputs.should_run == 'true'
        run: python analyze_calls.py

      - name: Analyze PUT options
        if: steps.brussels_time.outputs.should_run == 'true'
        run: python analyze_puts.py

      - name: Configure GitHub Pages
        if: steps.brussels_time.outputs.should_run == 'true'
        uses: actions/configure-pages@v5

      - name: Build publish folder
        if: steps.brussels_time.outputs.should_run == 'true'
        shell: bash
        working-directory: .
        run: |
          rm -rf _site
          mkdir -p _site

          cp -R OptionsWheel/web _site/web
          mkdir -p _site/data
          cp -R OptionsWheel/data/output _site/data/output
          cp -R OptionsWheel/config _site/config

          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=./web/index.html">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>OptionsWheel Dashboard</title>
          </head>
          <body>
            <p>Redirecting to <a href="./web/index.html">OptionsWheel dashboard</a>...</p>
          </body>
          </html>
          HTML

      - name: Upload Pages artifact
        if: steps.brussels_time.outputs.should_run == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        if: steps.brussels_time.outputs.should_run == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
