name: OptionsWheel tests

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/tests.yml"
      - "OptionsWheel/**"
      - ".agents/skills/option-candidate-check/**"
  pull_request:
    paths:
      - "OptionsWheel/**"
      - ".agents/skills/option-candidate-check/**"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: OptionsWheel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: OptionsWheel/requirements.lock

      - name: Install dependencies
        run: python -m pip install --only-binary :all: --require-hashes -r requirements.lock

      - name: Run tests
        run: python -m pytest -q
